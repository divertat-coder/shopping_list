<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Покупки">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Список покупок</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title">Список покупок</div>
    <div class="sync"><span id="dot" class="dot"></span><span id="syncTxt"></span></div>
    <button id="btnRefresh" class="icon-btn" aria-label="Обновить">⟳</button>
    <button id="btnSettings" class="icon-btn" aria-label="Настройки">⚙</button>
  </header>

  <main>
    <!-- Продукты -->
    <section id="v-pick" class="view">
      <div class="bar">
        <input id="search" type="search" placeholder="Найти продукт">
        <button id="btnEdit" class="btn">Правка</button>
      </div>
      <div id="pickBody"></div>
      <div class="bar" id="newCatBar"><button id="btnNewCat" class="btn">＋ Новая категория</button></div>
    </section>

    <!-- Список -->
    <section id="v-list" class="view hidden">
      <div id="listBody"></div>
    </section>

    <!-- История -->
    <section id="v-hist" class="view hidden">
      <div id="histBody"></div>
    </section>
  </main>

  <div id="doneBar" class="donebar hidden">
    <div><b id="leftCnt">0</b> <span id="leftTxt">осталось собрать</span></div>
    <button id="btnDone" class="btn primary big">Готово</button>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="pick">Продукты</button>
    <button class="tab" data-tab="list">Список <span id="badge" class="badge hidden">0</span></button>
    <button class="tab" data-tab="hist">История</button>
  </nav>
</div>

<div id="settings" class="overlay hidden">
  <div class="sheet">
    <h2>Настройки</h2>
    <label>Адрес скрипта Google (Web app URL)
      <input id="sUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    </label>
    <label>Пароль (TOKEN из скрипта)
      <input id="sToken" type="text" autocomplete="off">
    </label>
    <div class="row">
      <button id="sSave" class="btn primary">Сохранить</button>
      <button id="sClose" class="btn">Закрыть</button>
    </div>
    <hr>
    <p class="hint">Чтобы настроить приложение на телефоне жены или детей, скопируйте ссылку и отправьте им: адрес и пароль подставятся сами.</p>
    <div class="row"><button id="sLink" class="btn">Скопировать ссылку для семьи</button></div>
    <textarea id="sLinkOut" class="hidden" readonly rows="4"></textarea>
    <p class="hint" id="ver"></p>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
